name: Sync ArtStation
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests beautifulsoup4
      - run: python scripts/scrape-artstation.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync artstation projects"
          file_pattern: projects.json
